name: Update DTEK Schedule

on:
  schedule:
    - cron: '*/30 * * * *' # Кожні 30 хвилин
  workflow_dispatch:        # Кнопка для ручного запуску

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Fetch schedule
        run: python update_schedule.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update schedule.json" && git push)
